name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: vite production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci
      - name: Reject high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Build the production bundle
        run: npm run build
      - name: Check patch hygiene
        run: git diff --check
