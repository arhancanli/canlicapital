name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: vite production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sitemap lastmod derives from actual source history, not the checkout date.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci
      - name: Reject high or critical dependency advisories
        run: npm audit --audit-level=high
      - name: Build the production bundle
        run: npm run build
      - name: Install browser for developer interaction checks
        run: npx playwright install --with-deps chromium
      - name: Verify source evidence, SEO and developer contracts
        run: npm run verify
      - name: Verify bulk source catalog integrity
        run: npm run test:corpus
      - name: Verify change-notification batching
        run: npm run test:indexnow
      - name: Check patch hygiene
        run: git diff --check
