# The validation API keeps its keys and quotas, and the company pages their files, in a Supabase project on the
# free plan, and a free project pauses after about a week without a database query. The API's status endpoint
# runs one small query, so asking for it twice a day keeps the project awake. A run that finds the store
# unreachable fails, and GitHub emails the owner. Until now the only keep-alive was the Mac's nightly health
# check, which stopped reaching the site on 1 November; the project paused on 6 November, and every company
# page and keyed validation answered 503.
name: Keep the store awake

on:
  schedule:
    - cron: "41 5,17 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the validation API whether it reaches its store
        run: |
          body="$(curl -sS --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 https://canlicapital.com/api/v1/validate/status)" || { echo "The status endpoint did not answer." >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # A retried request prints every answer it got, so read the last one.
          reachable="$(printf '%s' "$body" | jq -rs 'last | .data.store_reachable | tostring')" || reachable="unreadable"
          echo "store_reachable: $reachable" >> "$GITHUB_STEP_SUMMARY"
          if [ "$reachable" != "true" ]; then echo "The store is unreachable: restore the Supabase project (dashboard, project canlicapital, Restore)." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
