name: Contributor access
description: Claim Contributor access for your API key after a merged contribution
title: "Contributor access"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing. Contributor access gives one API key 10,000 validations per UTC day instead of the standard 1,000, early access to new tools and servers on a beta endpoint, and priority on your issues and feature requests. The details are in [CONTRIBUTING.md](https://github.com/arhancanli/canlicapital/blob/main/CONTRIBUTING.md#rewards-contributor-access).

        **Never paste your API key here.** Name the key by its label, or by its SHA-256 fingerprint:

        ```bash
        printf '%s' "$CANLI_KEY" | shasum -a 256
        ```
  - type: input
    id: contribution
    attributes:
      label: Merged contribution
      description: A link to your merged pull request.
      placeholder: https://github.com/arhancanli/canlicapital/pull/123
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Key label or SHA-256 fingerprint
      description: The label you gave the key when you issued it, or the 64-character fingerprint printed by the command above. Never the key itself.
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: How should we credit you?
      description: The name or GitHub handle for the contributors list and changelog, or "no public credit".
  - type: checkboxes
    id: key-safety
    attributes:
      label: Key safety
      options:
        - label: This issue does not contain my API key (the value that starts with ck_live_).
          required: true
