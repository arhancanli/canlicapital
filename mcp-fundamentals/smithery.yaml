# Smithery configuration: https://smithery.ai/docs/config#smitheryyaml
#
# canli-fundamentals-mcp speaks stdio over the published npm package. This file tells Smithery's index and its
# CLI (`npx -y @smithery/cli install canli-fundamentals-mcp`) the exact command to spawn, the same command
# Claude Desktop or Claude Code would run directly (see README.md). The same tools are hosted, with
# no install, at the URL in server.json.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      canliApiBase:
        type: string
        description: >-
          Base URL that serves SEC fundamentals point in time. Defaults to https://canlicapital.com;
          point it at a preview deployment for testing.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'canli-fundamentals-mcp'],
      env: config.canliApiBase ? { CANLI_API_BASE: config.canliApiBase } : {}
    })
  exampleConfig:
    canliApiBase: https://canlicapital.com
